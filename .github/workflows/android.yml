name: Android CI e Releases
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Testes unitários e Android Lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-portal-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publicar APK assinado
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verificar segredos da assinatura
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.WIFI_PORTAL_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.WIFI_PORTAL_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release não publicada: configure os dois Secrets de assinatura descritos em RELEASE.md."
          fi
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          gradle-version: '8.11.1'
      - name: Restaurar chave privada
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.WIFI_PORTAL_KEYSTORE }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/portal-release.jks"
          test -s "$RUNNER_TEMP/portal-release.jks"
          echo "SHA256 do arquivo de assinatura recebido (não é a chave privada):"
          sha256sum "$RUNNER_TEMP/portal-release.jks" | cut -d " " -f 1
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/portal-release.jks" >> "$GITHUB_ENV"
      - name: Diagnosticar credenciais de assinatura sem expor segredos
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.WIFI_PORTAL_PASSWORD }}
        run: |
          set -euo pipefail
          if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storetype PKCS12 -storepass:env STORE_PASSWORD >/dev/null 2>&1; then
            echo "::error::O arquivo recebido não abre com WIFI_PORTAL_PASSWORD. Compare o SHA256 exibido no passo anterior com sha256sum ~/wifi-portal-signing/portal-release.jks no Termux. Se iguais, revise a senha; se diferentes, o Base64 cadastrado não é deste arquivo."
            exit 1
          fi
          if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storetype PKCS12 -storepass:env STORE_PASSWORD -alias portal >/dev/null 2>&1; then
            echo "::error::O keystore abre, mas o alias portal não foi encontrado."
            exit 1
          fi
          # Checa também a senha da chave privada, não apenas a senha do contêiner.
          TEMP_KEYSTORE="$RUNNER_TEMP/signing-check.p12"
          trap 'rm -f "$TEMP_KEYSTORE"' EXIT
          if ! keytool -importkeystore -noprompt -srckeystore "$ANDROID_KEYSTORE_PATH" -srcstoretype PKCS12 -srcstorepass:env STORE_PASSWORD -srcalias portal -srckeypass:env STORE_PASSWORD -destkeystore "$TEMP_KEYSTORE" -deststoretype PKCS12 -deststorepass:env STORE_PASSWORD -destkeypass:env STORE_PASSWORD >/dev/null 2>&1; then
            echo "::error::O arquivo abre, mas a chave privada portal não pode ser desbloqueada com a mesma senha. Verifique a senha interna da chave."
            exit 1
          fi
          echo "Keystore e chave privada validados com os Secrets atuais."
      - name: Compilar release assinada
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WIFI_PORTAL_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verificar assinatura e hash
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "WiFi-Captive-Portal-v0.1.${GITHUB_RUN_NUMBER}.apk"
          sha256sum WiFi-Captive-Portal-*.apk > SHA256SUMS.txt
      - name: Publicar release somente após verificação
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" WiFi-Captive-Portal-*.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Wi-Fi Captive Portal $TAG" \
            --notes "APK de release assinado com chave permanente; testes, lint, compilação e verificação da assinatura concluídos. Atualizar mantém os dados apenas se a versão previamente instalada tiver a mesma chave; a instalação exige confirmação do Android."
