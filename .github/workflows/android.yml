name: Android CI e Releases
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Testes unitários e Android Lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-portal-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publicar release após CI verde
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wifi-portal-apk-${{ github.run_number }}
          path: dist
      - name: Preparar pacote e verificação
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/app-debug.apk
          mv dist/app-debug.apk "WiFi-Captive-Portal-v0.1.${GITHUB_RUN_NUMBER}-preview.apk"
          sha256sum WiFi-Captive-Portal-*.apk > SHA256SUMS.txt
      - name: Publicar automaticamente no GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" WiFi-Captive-Portal-*.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Wi-Fi Captive Portal $TAG (prévia)" \
            --notes "Prévia Android gerada após testes unitários, lint e compilação aprovados. APK debug: a assinatura pode variar entre execuções; atualizações instaladas sobre versões anteriores não são garantidas. Instalação exige confirmação do Android. Sem controle de tráfego externo nem portal cativo automático." \
            --prerelease
